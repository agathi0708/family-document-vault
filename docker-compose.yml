services:
  postgres:
    image: postgres:16
    container_name: family-vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_document_vault
      POSTGRES_USER: family_vault_user
      POSTGRES_PASSWORD: family_vault_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: